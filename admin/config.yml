backend:
  name: github
  repo: michaelpeyrin-design/bikepunchline
  branch: main

media_folder: "assets/media/uploads"
public_folder: "/assets/media/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Image principale", name: "image", widget: "image", required: false }
      - { label: "Résumé", name: "summary", widget: "text", required: false }
      - { label: "Contenu", name: "body", widget: "markdown" }
